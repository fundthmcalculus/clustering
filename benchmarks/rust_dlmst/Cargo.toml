[package]
name = "rust_dlmst"
version = "0.1.0"
edition = "2021"
publish = false

# Dev-only performance comparison for benchmarks/mst_pareto.py; not shipped.
# No dependencies: threads come from std::thread::scope, and Python loads the
# cdylib through ctypes (see benchmarks/rust_dlmst.py).
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
