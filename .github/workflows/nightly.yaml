name: Nightly (full suite)

# pr.yaml runs `pytest --ci-fast`, and the project's own addopts already
# deselect `-m benchmark`. Two categories therefore run in no automated place:
#
#   * `ci_slow` scaling/plotting tests, and the full-size inputs the
#     `ci_scale(full, fast)` fixture shrinks under --ci-fast;
#   * everything marked `benchmark` -- the wall-clock assertions guarding the
#     Cython/OpenMP speedups this package exists for;
#   * every Python version except 3.11. `requires-python` claims `>=3.11`, but
#     pr.yaml pins 3.11, so a C-API or Cython break on a newer interpreter is
#     invisible until a user hits it. The matrix below covers the claim.
#
# A silent 20x loss in the compiled VAT path would pass every PR. It fails here.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

# Least privilege at the workflow level: only the `report` job needs to write,
# and it grants itself what it needs.
permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One red interpreter should not hide the state of the other three --
      # "3.14 broke" and "everything broke" need different responses.
      fail-fast: false
      matrix:
        # The full range `requires-python = ">=3.11"` promises. 3.11 stays
        # first because it is what pr.yaml gates on.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm the Cython extensions actually built
        # The benchmark leg below asserts wall-clock speedups. Those tests
        # skipif-guard on CYTHON_AVAILABLE, so an unbuilt extension turns the
        # entire point of this workflow into a green skip.
        run: python -c "import tribbleclustering.pcvat, tribbleclustering.cfcm, tribbleclustering.clk; print('compiled kernels present')"

      # CI_FAST is force-disabled: conftest auto-enables it from GITHUB_ACTIONS,
      # which is exactly the trimming this workflow exists to undo. `--no-ci-fast`
      # does not exist, so the env var that drives it is cleared instead.
      - name: Run the full-size correctness suite
        run: GITHUB_ACTIONS= CI= TRIBBLE_CI_FAST= pytest -v --durations=25

      - name: Run the benchmark suite
        # Separate step so a wall-clock regression is distinguishable at a glance
        # from a correctness failure -- they need very different responses.
        run: GITHUB_ACTIONS= CI= TRIBBLE_CI_FAST= pytest -m benchmark -v --durations=25

  report:
    # A job, not a step inside the matrix. With four legs the `if: failure()`
    # step fired up to four times concurrently, and four copies of the dedupe
    # below would race between `gh issue list` and `gh issue create` -- opening
    # exactly the duplicate issues that dedupe exists to prevent. `needs` plus
    # `if: failure()` fires this once per run, however many legs went red.
    needs: full-suite
    if: failure()
    runs-on: ubuntu-latest
    # A few gh calls. If they hang, give up in minutes rather than holding the
    # `nightly` concurrency group for the default six hours and blocking the
    # next night behind it.
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read  # to read back which matrix legs failed
    steps:
      - name: Report a failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Nightly full suite is failing"
          # Name the interpreters that went red. One leg failing is a version
          # problem; all four is a code problem, and the responses differ.
          # `|| FAILED=""` is load-bearing: under `set -e` a failed command
          # substitution in an assignment aborts the step, which would swallow
          # the whole failure report over a transient API error. Degrade to a
          # worse report, never to no report.
          FAILED=$(gh run view "${{ github.run_id }}" --json jobs             --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")') || FAILED=""
          [ -n "$FAILED" ] || FAILED="(could not read job names -- see the run)"
          # `gh issue create --label` errors on an unknown label, and a failed
          # report is worse than a noisy one, so ensure the label exists first.
          gh label create nightly-failure --color B60205             --description "Opened automatically when the nightly suite fails" 2>/dev/null || true
          # Exact title match over the labelled issues, NOT `--search "... in:title"`:
          # GitHub's search index lags behind issue creation by seconds to
          # minutes, so a search-based check can miss an issue that already
          # exists and open a duplicate -- the precise failure this dedupe is
          # here to prevent. The label list is served from the database and is
          # immediately consistent.
          existing=$(gh issue list --state open --label nightly-failure --limit 100             --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            # One issue that accumulates nights, not one issue per night.
            gh issue comment "$existing"               --body "Still failing on \`${{ github.sha }}\` -- failed: $FAILED -- [run]($RUN_URL)"
            echo "commented on #$existing"
          else
            {
              echo "The nightly run failed. \`pr.yaml\` runs \`pytest --ci-fast\` on Python 3.11 only, and addopts deselect \`-m benchmark\`, so this is a full-size correctness failure, a wall-clock benchmark regression, or a break on a Python version the PR gate never exercises -- none of which is visible to that gate."
              echo
              echo "Failed jobs: $FAILED"
              echo
              echo "Check which step failed: \"full-size correctness suite\" vs \"benchmark suite\". If only some interpreters are red, it is a version-compatibility break, not a logic regression."
              echo
              echo "- Commit: \`${{ github.sha }}\`"
              echo "- Run: $RUN_URL"
              echo
              echo "This issue collects one comment per failing night and is NOT closed"
              echo "automatically -- a nightly that starts passing again may just be flaky."
              echo "Close it once the cause is understood."
            } > issue-body.md
            gh issue create --title "$TITLE" --label nightly-failure --body-file issue-body.md
          fi
