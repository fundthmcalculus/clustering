name: pr.yaml
on:
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check the lockfile matches pyproject.toml
        # Nothing else in this job can see a `uv.lock` that disagrees with
        # `pyproject.toml`, and a desync here is not merely stale: while one is
        # live, a plain `uv run --project .` re-resolves and REWRITES the lock,
        # so a read-only command dirties the working tree. That breaks the
        # downstream grad-school harness, which vendors this repo as a pinned
        # submodule and requires that reproducing a result leaves it clean.
        #
        # `c4efd84` added three declarations without re-locking and the desync
        # survived four commits and nine days until #87 fixed it incidentally.
        # This is the check that would have caught it on the first PR.
        #
        # Scope worth knowing: this verifies lock <-> pyproject agreement only.
        # It cannot see a revision-less git dependency drifting behind its
        # upstream branch -- such a source is "in sync" with any locked commit,
        # however old (tribble-fis#201). Nothing here is git-sourced today, so
        # that gap is not live in this repo; do not read a green run as
        # "dependencies are current".
        run: |
          python -m pip install uv
          uv lock --check

      - name: Run black format check
        run: |
          black --check .

      - name: Run flake8 lint
        run: |
          flake8 src tests

      - name: Run mypy type check
        run: |
          mypy src

      - name: Run unit tests
        # --ci-fast trims the suite for shared runners: it deselects the
        # wall-clock/plot benchmarks (marked ci_slow) and shrinks oversized
        # correctness inputs. It is also auto-enabled by the GITHUB_ACTIONS
        # env var, so the flag here is explicit documentation of intent.
        run: |
          pytest --ci-fast